<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/syntax.css">

    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>

    
    <title>{{ site.title }}</title>
    

</head>
<body>
    <!-- gear background (decorative) --> <div id="gear-bg" aria-hidden="true"> <!-- Gear 1 --> <svg class="gear g1" viewBox="0 0 100 100" width="260" height="260" role="img" aria-hidden="true"> <g transform="translate(50,50)"> <path d="M0,-30 L8,-25 L18,-28 L24,-18 L32,-16 L30,-6 L36,2 L28,10 L30,20 L20,24 L12,32 L0,30 L-12,32 L-20,24 L-30,20 L-28,10 L-36,2 L-30,-6 L-32,-16 L-24,-18 L-18,-28 L-8,-25 Z" fill="currentColor"/> <circle r="10" fill="var(--background-color)"/> </g> </svg> <!-- Gear 2 --> <svg class="gear g2" viewBox="0 0 100 100" width="180" height="180" role="img" aria-hidden="true"> <g transform="translate(50,50)"> <path d="M0,-25 L6,-22 L14,-25 L18,-16 L24,-14 L22,-6 L26,2 L20,8 L22,18 L14,20 L8,26 L0,24 L-8,26 L-14,20 L-22,18 L-20,8 L-26,2 L-22,-6 L-24,-14 L-18,-16 L-14,-25 L-6,-22 Z" fill="currentColor"/> <circle r="8" fill="var(--background-color)"/> </g> </svg> <!-- Gear 3 --> <svg class="gear g3" viewBox="0 0 100 100" width="120" height="120" role="img" aria-hidden="true"> <g transform="translate(50,50)"> <path d="M0,-20 L5,-18 L10,-20 L12,-14 L16,-12 L15,-6 L18,2 L14,8 L15,14 L10,16 L6,20 L0,18 L-6,20 L-10,16 L-15,14 L-14,8 L-18,2 L-15,-6 L-16,-12 L-12,-14 L-10,-20 L-5,-18 Z" fill="currentColor"/> <circle r="6" fill="var(--background-color)"/> </g> </svg> </div>
    <!-- NAVBAR -->
     {% include navbar.html%}

     <div class="page">{{content}}</div>

 <script>
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', function(e) {
      this.classList.toggle('flipped');
    });
  });
</script>

     
</body>

    {% include footer.html%}
</html>
