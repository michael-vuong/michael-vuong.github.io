# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Michael Vuong's Engineering Portfolio # This is what shows up in the tab of the browser



# Hero Section
name: Michael Vuong
headline: Welcome! I am a junior majoring in mechanical engineering with a concentration in manufacturing at Boston University. 
description: >- # dont remove this line. this will ignore all new lines until the next section
  I’m passionate about researching and applying modern manufacturing methods to optimize production processes, reduce waste, and lower costs. 
  Beyond analysis, I enjoy bringing ideas to life through prototyping, whether I’m developing components in CAD, testing new design concepts, or refining designs through hands-on iteration. 
  This blend of process optimization and practical prototyping fuels my interest in engineering and continuous improvement. 

# About Me Section
about_text: >-
  Outside engineering, I my hobbies include volleyball, photography, opening Pokemon cards, rock climbing, listening to music, and traveling. 
  I also aim to be a better cook and to share memorable experiences with friends and family!

about_profile_image: ./assets/images/about-headshot.jpg



  
