<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Work Experience | Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <section class="work-experience-section">
    <h2>Work Experience</h2>
    <div class="experience-grid">
      <div class="card">
        <div class="card-inner">
          <div class="card-front">
            <img src="assets/images/bu-thumbnail.png" alt="Boston University Experience">
          </div>
          <div class="card-back">
            <h3>Engineer</h3>
            <p>Boston University</p>
            <ul>
              <li>Achievement 1</li>
              <li>Achievement 2</li>
            </ul>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front">
            <img src="assets/images/gm-thumbnail.png" alt="General Motors Experience">
          </div>
          <div class="card-back">
            <h3>Intern</h3>
            <p>General Motors</p>
            <ul>
              <li>Achievement 1</li>
              <li>Achievement 2</li>
            </ul>
          </div>
        </div>
      </div>
      <!-- Add more cards as needed -->
    </div>
  </section>
  
  <script>
    // Flip card on click:
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', function(e) {
        this.classList.toggle('flipped');
      });
    });
  </script>
</body>
</html>
